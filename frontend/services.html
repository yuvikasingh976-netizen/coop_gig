<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Services — coop_gig</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head><body class="app-bg">
<nav class="topbar"><div class="container d-flex align-items-center"><a class="brand" href="dashboard.html"><span class="brand-mark">c</span> coop_gig</a><a class="btn btn-light btn-sm ms-auto" href="dashboard.html"><i class="bi bi-grid me-1"></i>Dashboard</a></div></nav>
<div class="container py-5"><span class="eyebrow">MARKETPLACE</span><h1 class="fw-bold mt-1">Services</h1><p class="text-secondary">Choose what you need and find a skilled cooperative worker.</p>
<div id="services" class="row g-4 mt-2"><div class="col-12"><div class="content-card">Loading services...</div></div></div></div>
<script src="js/app.js"></script><script>
const icons=["bi-lightning-charge","bi-droplet","bi-hammer","bi-brush","bi-stars","bi-flower1","bi-car-front","bi-heart","bi-cpu"];
async function loadServices(){try{const r=await api("/services/");const d=await r.json();if(!r.ok)throw Error(formatApiError(d));
document.getElementById("services").innerHTML=d.map((s,i)=>`<div class="col-sm-6 col-lg-4"><div class="service-card-lg"><div class="service-icon"><i class="bi ${icons[i%icons.length]}"></i></div><div class="flex-grow-1"><span class="small text-secondary">${s.category}</span><h5 class="fw-bold mt-1">${s.name}</h5><p class="text-secondary small">${s.description||"Professional cooperative service."}</p><div class="d-flex justify-content-between align-items-center"><strong>₹${s.base_price}</strong><a href="workers.html?service_id=${s.id}" class="btn btn-sm btn-primary">Find workers</a></div></div></div></div>`).join("");}catch(e){document.getElementById("services").innerHTML=`<div class="alert alert-danger">${e.message}</div>`;}}
loadServices();
</script></body></html>
