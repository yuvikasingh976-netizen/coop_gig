<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Skills — coop_gig</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">

</head>


<body class="app-bg">


<!-- TOPBAR -->

<nav class="topbar">

    <div class="container-fluid px-4">

        <div class="d-flex align-items-center">

            <a
                class="brand"
                href="worker-dashboard.html"
            >

                <span class="brand-mark">
                    c
                </span>

                coop_gig

            </a>


            <div class="ms-auto d-flex align-items-center gap-3">

                <span class="role-badge">
                    WORKER
                </span>

                <button
                    class="btn btn-light btn-sm"
                    onclick="logout()"
                >

                    <i class="bi bi-box-arrow-right me-1"></i>
                    Logout

                </button>

            </div>

        </div>

    </div>

</nav>



<!-- MAIN -->

<div class="container-fluid px-4 py-4">

    <div class="row g-4">


        <!-- SIDEBAR -->

        <aside class="col-xl-2 col-lg-3">

            <div class="sidebar-card">

                <a
                    class="side-link"
                    href="worker-dashboard.html"
                >
                    <i class="bi bi-grid-1x2-fill"></i>
                    Overview
                </a>


                <a
                    class="side-link"
                    href="worker-jobs.html"
                >
                    <i class="bi bi-briefcase"></i>
                    My Jobs
                </a>


                <a
                    class="side-link"
                    href="worker-earnings.html"
                >
                    <i class="bi bi-wallet2"></i>
                    Earnings
                </a>


                <a
                    class="side-link active"
                    href="worker-skills.html"
                >
                    <i class="bi bi-tools"></i>
                    My Skills
                </a>


                <a
                    class="side-link"
                    href="worker-certifications.html"
                >
                    <i class="bi bi-patch-check"></i>
                    Certifications
                </a>


                <a
                    class="side-link"
                    href="worker-welfare.html"
                >
                    <i class="bi bi-shield-check"></i>
                    Welfare
                </a>


                <a
                    class="side-link"
                    href="worker-profile.html"
                >
                    <i class="bi bi-person"></i>
                    My Profile
                </a>


                <button
                    class="side-link"
                    onclick="logout()"
                >
                    <i class="bi bi-box-arrow-left"></i>
                    Sign out
                </button>

            </div>

        </aside>



        <!-- CONTENT -->

        <main class="col-xl-10 col-lg-9">


            <div class="mb-4">

                <span class="eyebrow">
                    PROFESSIONAL PROFILE
                </span>

                <h1 class="fw-bold mt-1 mb-1">
                    My Skills
                </h1>

                <p class="text-secondary mb-0">
                    Skills and services you provide through coop_gig.
                </p>

            </div>



            <div class="content-card">


                <div
                    class="d-flex flex-wrap
                           justify-content-between
                           align-items-center mb-4"
                >

                    <div>

                        <h5 class="fw-bold mb-1">
                            Skills & Services
                        </h5>

                        <p class="text-secondary small mb-0">
                            Your registered professional skills.
                        </p>

                    </div>


                    <button
                        class="btn btn-outline-primary"
                        onclick="loadSkills()"
                    >

                        <i class="bi bi-arrow-clockwise me-1"></i>
                        Refresh

                    </button>

                </div>



                <div id="skillsContainer">

                    <div class="text-center py-5 text-secondary">

                        <div
                            class="spinner-border mb-3"
                            role="status"
                        ></div>

                        <div>
                            Loading skills...
                        </div>

                    </div>

                </div>


            </div>


        </main>

    </div>

</div>



<script src="js/app.js"></script>


<script>

requireLogin();


async function loadSkills() {

    const container =
        document.getElementById("skillsContainer");


    container.innerHTML = `

        <div class="text-center py-5 text-secondary">

            <div
                class="spinner-border mb-3"
                role="status"
            ></div>

            <div>
                Loading skills...
            </div>

        </div>

    `;


    try {

        /*
         * CORRECT BACKEND ENDPOINT
         *
         * GET /worker-skills/me
         */

        const response =
            await api("/worker-skills/me");


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                formatApiError(data)
            );

        }


        if (!Array.isArray(data) || data.length === 0) {

            container.innerHTML = `

                <div class="empty-state">

                    <i class="bi bi-tools"></i>

                    <h5 class="mt-3">
                        No skills added
                    </h5>

                    <p class="mb-0">
                        Your professional skills
                        will appear here.
                    </p>

                </div>

            `;

            return;

        }


        container.innerHTML = `

            <div class="row g-3">

                ${data.map(skill => `

                    <div class="col-md-6 col-xl-4">

                        <div class="service-card-lg">

                            <div class="service-icon">

                                <i class="bi bi-tools"></i>

                            </div>


                            <div>

                                <h6 class="fw-bold mb-2">

                                    Service #${skill.service_id}

                                </h6>


                                <span
                                    class="status-pill accepted"
                                >

                                    ${skill.skill_level}

                                </span>


                                <p
                                    class="small
                                           text-secondary
                                           mt-3
                                           mb-0"
                                >

                                    <i class="bi bi-clock me-1"></i>

                                    ${skill.years_experience}

                                    ${
                                        skill.years_experience == 1
                                            ? "year"
                                            : "years"
                                    }

                                    experience

                                </p>

                            </div>

                        </div>

                    </div>

                `).join("")}

            </div>

        `;

    }


    catch(error) {

        console.error(
            "Skills error:",
            error
        );


        container.innerHTML = `

            <div class="alert alert-danger">

                <i
                    class="bi bi-exclamation-circle me-2"
                ></i>

                ${error.message}

            </div>

        `;

    }

}


loadSkills();

</script>


</body>

</html>
