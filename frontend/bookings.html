<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookings — coop_gig</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head><body class="app-bg">
<nav class="topbar"><div class="container d-flex align-items-center"><a class="brand" href="dashboard.html"><span class="brand-mark">c</span> coop_gig</a><a class="btn btn-light btn-sm ms-auto" href="dashboard.html">Dashboard</a></div></nav>
<div class="container py-5"><span class="eyebrow">ACTIVITY</span><h1 class="fw-bold mt-1">My bookings</h1><p class="text-secondary">Track your service requests and their current status.</p>
<div id="bookings" class="mt-4"></div></div>
<script src="js/app.js"></script><script>
requireLogin();
async function loadBookings(){try{const r=await api("/bookings/my");const d=await r.json();if(!r.ok)throw Error(formatApiError(d));const box=document.getElementById("bookings");
if(!d.length){box.innerHTML='<div class="empty-state"><i class="bi bi-calendar2-x"></i><h5>No bookings yet</h5><p>Find a worker and book your first service.</p><a class="btn btn-primary" href="workers.html">Find a worker</a></div>';return;}
box.innerHTML=`<div class="content-card p-0 overflow-hidden"><div class="table-responsive"><table class="table table-modern align-middle mb-0"><thead><tr><th>Booking</th><th>Service</th><th>Schedule</th><th>Location</th><th>Amount</th><th>Status</th></tr></thead><tbody>${d.map(b=>`<tr><td><strong>#${b.id}</strong></td><td>Service #${b.service_id}</td><td>${b.scheduled_date}<br><small>${b.scheduled_time}</small></td><td>${b.city}</td><td>₹${b.estimated_amount}</td><td><span class="status-pill ${String(b.status).toLowerCase()}">${b.status}</span></td></tr>`).join("")}</tbody></table></div></div>`;}catch(e){document.getElementById("bookings").innerHTML=`<div class="alert alert-danger">${e.message}</div>`;}}
loadBookings();
</script></body></html>
