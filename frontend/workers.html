<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Workers — coop_gig</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head><body class="app-bg">
<nav class="topbar"><div class="container d-flex align-items-center"><a class="brand" href="dashboard.html"><span class="brand-mark">c</span> coop_gig</a><a class="btn btn-light btn-sm ms-auto" href="dashboard.html">Dashboard</a></div></nav>
<div class="container py-5"><span class="eyebrow">DISCOVERY</span><h1 class="fw-bold mt-1">Find skilled workers</h1><p class="text-secondary">Search by service and optionally match workers near a location.</p>
<div class="content-card mb-4"><div class="row g-3 align-items-end"><div class="col-md-3"><label class="form-label">Service ID</label><input id="serviceId" class="form-control" placeholder="e.g. 1"></div><div class="col-md-3"><label class="form-label">Latitude</label><input id="latitude" class="form-control" placeholder="20.2961"></div><div class="col-md-3"><label class="form-label">Longitude</label><input id="longitude" class="form-control" placeholder="85.8245"></div><div class="col-md-3"><button class="btn btn-primary w-100" onclick="searchWorkers()"><i class="bi bi-search me-2"></i>Search workers</button></div></div></div>
<div id="workers" class="row g-4"></div></div>
<script src="js/app.js"></script><script>
const p=new URLSearchParams(location.search); if(p.get("service_id"))document.getElementById("serviceId").value=p.get("service_id");
async function searchWorkers(){const q=new URLSearchParams();if(serviceId.value)q.set("service_id",serviceId.value);if(latitude.value)q.set("latitude",latitude.value);if(longitude.value)q.set("longitude",longitude.value);const box=document.getElementById("workers");box.innerHTML='<div class="col-12"><div class="content-card text-secondary">Searching...</div></div>';
try{const r=await api("/search/workers?"+q);const d=await r.json();if(!r.ok)throw Error(formatApiError(d));box.innerHTML=d.length?d.map(w=>`<div class="col-md-6 col-xl-4"><div class="worker-card"><div class="d-flex align-items-start"><div class="avatar">${(w.name||"W").split(" ").map(x=>x[0]).slice(0,2).join("")}</div><div class="ms-3"><h5 class="fw-bold mb-1">${w.name}</h5><p class="text-secondary small mb-1">${w.service_name} · ${w.skill_level}</p><span class="verified-badge"><i class="bi bi-patch-check-fill me-1"></i>${w.verification_status}</span></div></div><div class="worker-meta mt-4"><span><i class="bi bi-star-fill text-warning"></i> ${w.average_rating}</span><span><i class="bi bi-briefcase"></i> ${w.total_jobs} jobs</span><span><i class="bi bi-clock"></i> ₹${w.hourly_rate}/hr</span></div><div class="small text-secondary mt-3">${w.years_experience} years experience${w.distance_km!=null?" · "+w.distance_km+" km away":""}</div><button class="btn btn-primary w-100 mt-3" onclick="alert('Worker selected. Use the booking API from the backend or continue through the demo flow.')">View & book</button></div></div>`).join(""):'<div class="col-12"><div class="empty-state"><i class="bi bi-search"></i><h5>No workers found</h5><p>Try another service or location.</p></div></div>';}catch(e){box.innerHTML=`<div class="col-12"><div class="alert alert-danger">${e.message}</div></div>`;}}
searchWorkers();
</script></body></html>
