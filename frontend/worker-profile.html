<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Profile — coop_gig</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="app-bg">


<nav class="topbar">

    <div class="container-fluid px-4">

        <div class="d-flex align-items-center">

            <a class="brand" href="worker-dashboard.html">
                <span class="brand-mark">c</span>
                coop_gig
            </a>

            <div class="ms-auto d-flex gap-3 align-items-center">

                <span class="role-badge">
                    WORKER
                </span>

                <button
                    class="btn btn-light btn-sm"
                    onclick="logout()"
                >
                    <i class="bi bi-box-arrow-right me-1"></i>
                    Logout
                </button>

            </div>

        </div>

    </div>

</nav>


<div class="container-fluid px-4 py-4">

    <div class="row g-4">

        <aside class="col-xl-2 col-lg-3">

            <div class="sidebar-card">

                <a class="side-link" href="worker-dashboard.html">
                    <i class="bi bi-grid-1x2-fill"></i>
                    Overview
                </a>

                <a class="side-link" href="worker-jobs.html">
                    <i class="bi bi-briefcase"></i>
                    My Jobs
                </a>

                <a class="side-link" href="worker-earnings.html">
                    <i class="bi bi-wallet2"></i>
                    Earnings
                </a>

                <a class="side-link" href="worker-skills.html">
                    <i class="bi bi-tools"></i>
                    My Skills
                </a>

                <a class="side-link" href="worker-certifications.html">
                    <i class="bi bi-patch-check"></i>
                    Certifications
                </a>

                <a class="side-link" href="worker-welfare.html">
                    <i class="bi bi-shield-check"></i>
                    Welfare
                </a>

                <a
                    class="side-link active"
                    href="worker-profile.html"
                >
                    <i class="bi bi-person"></i>
                    My Profile
                </a>

                <button class="side-link" onclick="logout()">
                    <i class="bi bi-box-arrow-left"></i>
                    Sign out
                </button>

            </div>

        </aside>


        <main class="col-xl-10 col-lg-9">

            <div class="mb-4">

                <span class="eyebrow">
                    ACCOUNT
                </span>

                <h1 class="fw-bold mt-1">
                    My Profile
                </h1>

                <p class="text-secondary">
                    View your account and professional information.
                </p>

            </div>


            <div class="content-card">

                <div id="profileContainer">

                    <div class="text-center py-5 text-secondary">

                        <div class="spinner-border mb-3"></div>

                        <div>
                            Loading profile...
                        </div>

                    </div>

                </div>

            </div>

        </main>

    </div>

</div>


<script src="js/app.js"></script>

<script>

requireLogin();


async function loadProfile() {

    const container =
        document.getElementById(
            "profileContainer"
        );

    try {

        const response =
            await api("/workers/me");

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(formatApiError(data));
        }


        container.innerHTML = `

            <div class="row g-4">

                <div class="col-md-4">

                    <div class="text-center">

                        <div
                            class="avatar"
                            style="
                                width:90px;
                                height:90px;
                                font-size:2rem;
                                margin:auto;
                            "
                        >
                            ${data.name
                                ? data.name.charAt(0).toUpperCase()
                                : "W"}
                        </div>

                        <h4 class="fw-bold mt-3">
                            ${data.name || "Worker"}
                        </h4>

                        <span class="status-pill accepted">
                            WORKER
                        </span>

                    </div>

                </div>


                <div class="col-md-8">

                    <div class="row g-3">

                        <div class="col-md-6">

                            <small class="text-secondary">
                                Experience
                            </small>

                            <h6 class="fw-bold mt-1">
                                ${data.experience_years || 0}
                                years
                            </h6>

                        </div>


                        <div class="col-md-6">

                            <small class="text-secondary">
                                Hourly Rate
                            </small>

                            <h6 class="fw-bold mt-1">
                                ₹${data.hourly_rate || 0}
                            </h6>

                        </div>


                        <div class="col-md-6">

                            <small class="text-secondary">
                                Rating
                            </small>

                            <h6 class="fw-bold mt-1">

                                <i
                                    class="bi bi-star-fill text-warning"
                                ></i>

                                ${data.average_rating || 0}

                            </h6>

                        </div>


                        <div class="col-md-6">

                            <small class="text-secondary">
                                Completed Jobs
                            </small>

                            <h6 class="fw-bold mt-1">
                                ${data.total_jobs || 0}
                            </h6>

                        </div>


                        <div class="col-12">

                            <small class="text-secondary">
                                Bio
                            </small>

                            <p class="mt-1 mb-0">
                                ${
                                    data.bio ||
                                    "No professional bio added yet."
                                }
                            </p>

                        </div>

                    </div>

                </div>

            </div>

        `;

    }

    catch(error) {

        container.innerHTML = `
            <div class="alert alert-danger">
                ${error.message}
            </div>
        `;

    }

}

loadProfile();

</script>

</body>
</html>
