            <div class="sidebar-card">

                <a

                </a>


                <a

                </a>


                <a

        <!-- =================================================

            >

                    <span class="eyebrow">

            <!-- =================================================

            <div class="row g-3 mb-4">


                <div class="col-md-4">

                    <div class="worker-stat-card">

                        <div class="worker-stat-icon blue">

<!-- =========================================================
     JAVASCRIPT
     ========================================================= -->

<script src="js/app.js"></script>


<script>


/* =========================================================
   LOGIN CHECK
   ========================================================= */

requireLogin();


/* =========================================================
   LOAD JOBS
   ========================================================= */

async function loadJobs() {

    const container =
        document.getElementById(
            "jobsContainer"
        );


    container.innerHTML = `

        <div class="text-center py-5 text-secondary">

            <div
                class="spinner-border mb-3"
                role="status"
            ></div>

            <div>
                Loading jobs...
            </div>

        </div>

    `;


    try {


        /* =============================================
           CALL BACKEND
           ============================================= */

        const response =
            await api(
                "/bookings/worker"
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                formatApiError(data)
            );

        }


        /* =============================================
           STATISTICS
           ============================================= */

        const total =
            data.length;


        const pending =
            data.filter(
                job =>
                    job.status === "PENDING"
            ).length;


        const completed =
            data.filter(
                job =>
                    job.status === "COMPLETED"
            ).length;


        document.getElementById(
            "totalJobs"
        ).textContent = total;


        document.getElementById(
            "pendingJobs"
        ).textContent = pending;


        document.getElementById(
            "completedJobs"
        ).textContent = completed;


        /* =============================================
           EMPTY STATE
           ============================================= */

        if (!data.length) {

            container.innerHTML = `

                <div class="empty-state">

                    <i class="bi bi-briefcase"></i>

                    <h5 class="mt-3">
                        No jobs yet
                    </h5>

                    <p class="mb-0">

                        You don't have any service requests
                        assigned to you yet.

                    </p>

                </div>

            `;

            return;

        }


        /* =============================================
           JOB CARDS
           ============================================= */

        container.innerHTML =
            data.map(
                job =>
                    createJobCard(job)
            ).join("");


    }

    catch (error) {

        console.error(
            "Jobs error:",
            error
        );


        container.innerHTML = `

            <div class="alert alert-danger">

                <i
                    class="bi bi-exclamation-circle me-2"
                ></i>

                ${error.message}

            </div>

        `;

    }

}


/* =========================================================
   CREATE JOB CARD
   ========================================================= */

function createJobCard(job) {


    const status =
        String(
            job.status
        ).toUpperCase();


    const statusClass =
        status.toLowerCase();


    let actions = "";


    /* =============================================
       PENDING
       ============================================= */

    if (status === "PENDING") {

        actions = `

            <button
                class="btn btn-success btn-sm"
                onclick="updateJob(${job.id}, 'accept')"
            >

                <i class="bi bi-check-lg me-1"></i>

                Accept

            </button>


            <button
                class="btn btn-outline-danger btn-sm"
                onclick="updateJob(${job.id}, 'reject')"
            >

                <i class="bi bi-x-lg me-1"></i>

                Reject

            </button>

        `;

    }


    /* =============================================
       ACCEPTED
       ============================================= */

    else if (status === "ACCEPTED") {

        actions = `

            <button
                class="btn btn-primary btn-sm"
                onclick="updateJob(${job.id}, 'start')"
            >

                <i class="bi bi-play-fill me-1"></i>

                Start Job

            </button>

        `;

    }


    /* =============================================
       IN PROGRESS
       ============================================= */

    else if (status === "IN_PROGRESS") {

        actions = `

            <button
                class="btn btn-success btn-sm"
                onclick="updateJob(${job.id}, 'complete')"
            >

                <i class="bi bi-check2-circle me-1"></i>

                Complete Job

            </button>

        `;

    }


    /* =============================================
       COMPLETED
       ============================================= */

    else if (status === "COMPLETED") {

        actions = `

            <span class="text-success small">

                <i class="bi bi-check-circle-fill me-1"></i>

                Job completed

            </span>

        `;

    }


    /* =============================================
       REJECTED / CANCELLED
       ============================================= */

    else {

        actions = `

            <span class="text-secondary small">

                No actions available

            </span>

        `;

    }


    return `

        <div class="job-card mb-3">


            <div class="job-card-header">


                <div class="d-flex align-items-center gap-3">


                    <div class="job-icon">

                        <i class="bi bi-tools"></i>

                    </div>


                    <div>

                        <h6 class="fw-bold mb-1">

                            Service #${job.service_id}

                        </h6>

                        <small class="text-secondary">

                            Booking #${job.id}

                        </small>

                    </div>


                </div>


                <span
                    class="status-pill ${statusClass}"
                >

                    ${status.replaceAll("_", " ")}

                </span>


            </div>


            <div class="job-card-body">


                <div class="row g-3">


                    <div class="col-md-3">

                        <small class="job-label">
                            Customer
                        </small>

                        <div class="job-value">

                            <i class="bi bi-person me-1"></i>

                            Customer #${job.customer_id}

                        </div>

                    </div>


                    <div class="col-md-3">

                        <small class="job-label">
                            Date
                        </small>

                        <div class="job-value">

                            <i class="bi bi-calendar3 me-1"></i>

                            ${job.scheduled_date}

                        </div>

                    </div>


                    <div class="col-md-3">

                        <small class="job-label">
                            Time
                        </small>

                        <div class="job-value">

                            <i class="bi bi-clock me-1"></i>

                            ${job.scheduled_time}

                        </div>

                    </div>


                    <div class="col-md-3">

                        <small class="job-label">
                            Amount
                        </small>

                        <div class="job-value fw-bold">

                            ₹${Number(
                                job.estimated_amount || 0
                            ).toLocaleString("en-IN")}

                        </div>

                    </div>


                    <div class="col-md-6">

                        <small class="job-label">
                            Location
                        </small>

                        <div class="job-value">

                            <i class="bi bi-geo-alt me-1"></i>

                            ${job.address},
                            ${job.city}

                        </div>

                    </div>


                    <div class="col-md-6">

                        <small class="job-label">
                            Description
                        </small>

                        <div class="job-value">

                            ${
                                job.description
                                || "No description provided."
                            }

                        </div>

                    </div>


                </div>


            </div>


            <div class="job-card-footer">

                ${actions}

            </div>


        </div>

    `;

}


/* =========================================================
   UPDATE JOB STATUS
   ========================================================= */

async function updateJob(
    bookingId,
    action
) {


    const confirmation =
        confirm(
            `Are you sure you want to ${action.replace(
                "_",
                " "
            )} booking #${bookingId}?`
        );


    if (!confirmation) {

        return;

    }


    try {


        const response =
            await api(
                `/bookings/${bookingId}/${action}`,
                {
                    method: "PATCH"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                formatApiError(data)
            );

        }


        /*
         * Reload jobs
         */

        await loadJobs();


    }

    catch (error) {

        alert(
            error.message
        );

    }

}


/* =========================================================
   ROLE BADGE
   ========================================================= */

const role =
    localStorage.getItem("role")
    || "WORKER";


document.getElementById(
    "roleBadge"
).textContent =
    role.replaceAll(
        "_",
        " "
    );


/* =========================================================
   INITIAL LOAD
   ========================================================= */

loadJobs();


</script>
