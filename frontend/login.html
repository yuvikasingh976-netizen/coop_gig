<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — coop_gig</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head><body class="auth-page">
<div class="auth-shell">
  <a class="brand mb-4 d-inline-flex" href="index.html"><span class="brand-mark">c</span> coop_gig</a>
  <div class="auth-card">
    <div class="text-center mb-4"><div class="auth-icon"><i class="bi bi-box-arrow-in-right"></i></div><h2 class="fw-bold mt-3">Welcome back</h2><p class="text-secondary mb-0">Sign in to your coop_gig account.</p></div>
    <div id="message"></div>
    <form id="loginForm">
      <label class="form-label">Email</label><input id="email" type="email" class="form-control form-control-lg mb-3" placeholder="you@example.com" required>
      <label class="form-label">Password</label><div class="input-group mb-4"><input id="password" type="password" class="form-control form-control-lg" placeholder="Your password" required><button class="btn btn-outline-secondary" type="button" onclick="togglePassword('password',this)"><i class="bi bi-eye"></i></button></div>
      <button class="btn btn-primary btn-lg w-100">Sign in <i class="bi bi-arrow-right ms-2"></i></button>
    </form>
    <p class="text-center text-secondary mt-4 mb-0">Don't have an account? <a href="register.html">Create one</a></p>
  </div>
</div>
<script src="js/app.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", async e => {
 e.preventDefault(); const msg=document.getElementById("message");
 try {
  const res=await api("/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email.value.trim(),password:password.value})});
  const data=await res.json(); if(!res.ok) throw new Error(formatApiError(data));
  localStorage.setItem("token",data.access_token);
  localStorage.setItem("role",decodeToken(data.access_token)?.role || "");
  window.location.href="dashboard.html";
 } catch(err){msg.innerHTML=`<div class="alert alert-danger">${err.message}</div>`;}
});
</script>
</body></html>
