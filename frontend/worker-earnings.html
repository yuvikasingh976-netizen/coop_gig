<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Earnings — coop_gig</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="app-bg">

<nav class="topbar">
    <div class="container-fluid px-4">
        <div class="d-flex align-items-center">

            <a class="brand" href="worker-dashboard.html">
                <span class="brand-mark">c</span>
                coop_gig
            </a>

            <div class="ms-auto d-flex align-items-center gap-3">
                <span class="role-badge">WORKER</span>

                <button class="btn btn-light btn-sm" onclick="logout()">
                    <i class="bi bi-box-arrow-right me-1"></i>
                    Logout
                </button>
            </div>

        </div>
    </div>
</nav>


<div class="container-fluid px-4 py-4">

    <div class="row g-4">

        <!-- SIDEBAR -->
        <aside class="col-xl-2 col-lg-3">

            <div class="sidebar-card">

                <a class="side-link" href="worker-dashboard.html">
                    <i class="bi bi-grid-1x2-fill"></i>
                    Overview
                </a>

                <a class="side-link" href="worker-jobs.html">
                    <i class="bi bi-briefcase"></i>
                    My Jobs
                </a>

                <a class="side-link active" href="worker-earnings.html">
                    <i class="bi bi-wallet2"></i>
                    Earnings
                </a>

                <a class="side-link" href="worker-skills.html">
                    <i class="bi bi-tools"></i>
                    My Skills
                </a>

                <a class="side-link" href="worker-certifications.html">
                    <i class="bi bi-patch-check"></i>
                    Certifications
                </a>

                <a class="side-link" href="worker-welfare.html">
                    <i class="bi bi-shield-check"></i>
                    Welfare
                </a>

                <a class="side-link" href="worker-profile.html">
                    <i class="bi bi-person"></i>
                    My Profile
                </a>

                <button class="side-link" onclick="logout()">
                    <i class="bi bi-box-arrow-left"></i>
                    Sign out
                </button>

            </div>

        </aside>


        <!-- CONTENT -->
        <main class="col-xl-10 col-lg-9">

            <div class="mb-4">

                <span class="eyebrow">FINANCIAL OVERVIEW</span>

                <h1 class="fw-bold mt-1 mb-1">
                    My Earnings
                </h1>

                <p class="text-secondary">
                    Track your income from completed service jobs.
                </p>

            </div>


            <!-- STATS -->
            <div class="row g-3 mb-4">

                <div class="col-md-6">

                    <div class="worker-stat-card">

                        <div class="worker-stat-icon orange">
                            <i class="bi bi-currency-rupee"></i>
                        </div>

                        <div>
                            <small>Total Earnings</small>
                            <strong id="totalEarnings">₹0</strong>
                        </div>

                    </div>

                </div>


                <div class="col-md-6">

                    <div class="worker-stat-card">

                        <div class="worker-stat-icon green">
                            <i class="bi bi-briefcase"></i>
                        </div>

                        <div>
                            <small>Completed Jobs</small>
                            <strong id="totalJobs">0</strong>
                        </div>

                    </div>

                </div>

            </div>


            <!-- EARNINGS -->
            <div class="content-card">

                <div class="mb-4">

                    <h5 class="fw-bold mb-1">
                        Payment History
                    </h5>

                    <p class="text-secondary small mb-0">
                        Successful payments received for your jobs.
                    </p>

                </div>


                <div id="earningsContainer">

                    <div class="text-center py-5 text-secondary">
                        <div class="spinner-border mb-3"></div>
                        <div>Loading earnings...</div>
                    </div>

                </div>

            </div>

        </main>

    </div>

</div>


<script src="js/app.js"></script>

<script>

requireLogin();


async function loadEarnings() {

    const container =
        document.getElementById("earningsContainer");

    try {

        const summaryResponse =
            await api("/payments/worker/earnings/summary");

        const summary =
            await summaryResponse.json();

        if (summaryResponse.ok) {

            document.getElementById(
                "totalEarnings"
            ).textContent =
                "₹" +
                Number(
                    summary.total_earnings || 0
                ).toLocaleString("en-IN");

            document.getElementById(
                "totalJobs"
            ).textContent =
                summary.total_jobs || 0;
        }


        const response =
            await api("/payments/worker/earnings");

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(formatApiError(data));
        }


        if (!data.length) {

            container.innerHTML = `
                <div class="empty-state">

                    <i class="bi bi-wallet2"></i>

                    <h5 class="mt-3">
                        No earnings yet
                    </h5>

                    <p>
                        Earnings from successful payments
                        will appear here.
                    </p>

                </div>
            `;

            return;
        }


        container.innerHTML = `

            <div class="table-responsive">

                <table class="table table-modern align-middle">

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Payment</th>
                            <th>Amount</th>
                            <th>Type</th>
                        </tr>
                    </thead>

                    <tbody>

                        ${data.map(item => `

                            <tr>

                                <td>#${item.id}</td>

                                <td>
                                    Payment #${item.payment_id}
                                </td>

                                <td class="fw-bold">
                                    ₹${Number(
                                        item.amount || 0
                                    ).toLocaleString("en-IN")}
                                </td>

                                <td>
                                    <span class="status-pill success">
                                        ${item.earning_type}
                                    </span>
                                </td>

                            </tr>

                        `).join("")}

                    </tbody>

                </table>

            </div>

        `;

    }

    catch(error) {

        container.innerHTML = `
            <div class="alert alert-danger">
                ${error.message}
            </div>
        `;

    }

}

loadEarnings();

</script>

</body>
</html>
