<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account — coop_gig</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <!-- Project CSS -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body class="auth-page">


    <!-- =====================================================
         AUTH CONTAINER
         ===================================================== -->

    <div class="auth-shell">


        <!-- BRAND -->

        <a
            class="brand mb-4 d-inline-flex"
            href="index.html"
        >

            <span class="brand-mark">
                c
            </span>

            coop_gig

        </a>


        <!-- =================================================
             REGISTER CARD
             ================================================= -->

        <div class="auth-card">


            <!-- HEADER -->

            <div class="mb-4">

                <span class="eyebrow">
                    GET STARTED
                </span>

                <h2 class="fw-bold mt-2">
                    Create your account
                </h2>

                <p class="text-secondary">
                    Join the cooperative marketplace.
                </p>

            </div>


            <!-- =================================================
                 MESSAGE AREA
                 ================================================= -->

            <div id="message"></div>


            <!-- =================================================
                 REGISTER FORM
                 ================================================= -->

            <form id="registerForm">


                <!-- FULL NAME -->

                <div class="mb-3">

                    <label
                        for="name"
                        class="form-label"
                    >
                        Full name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        class="form-control form-control-lg"
                        placeholder="Your name"
                        autocomplete="name"
                        required
                        minlength="2"
                        maxlength="100"
                    >

                </div>


                <!-- EMAIL -->

                <div class="mb-3">

                    <label
                        for="email"
                        class="form-label"
                    >
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control form-control-lg"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- PHONE -->

                <div class="mb-3">

                    <label
                        for="phone"
                        class="form-label"
                    >
                        Phone
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        class="form-control form-control-lg"
                        placeholder="10-digit phone number"
                        autocomplete="tel"
                        required
                        minlength="10"
                        maxlength="20"
                    >

                </div>


                <!-- PASSWORD -->

                <div class="mb-3">

                    <label
                        for="password"
                        class="form-label"
                    >
                        Password
                    </label>

                    <div class="input-group">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control form-control-lg"
                            placeholder="At least 6 characters"
                            autocomplete="new-password"
                            required
                            minlength="6"
                            maxlength="100"
                        >

                        <button
                            type="button"
                            class="btn btn-outline-secondary"
                            id="togglePassword"
                            title="Show password"
                        >
                            <i class="bi bi-eye"></i>
                        </button>

                    </div>

                </div>


                <!-- ROLE -->

                <div class="mb-4">

                    <label
                        for="role"
                        class="form-label"
                    >
                        I am joining as
                    </label>

                    <select
                        id="role"
                        name="role"
                        class="form-select form-select-lg"
                        required
                    >

                        <option value="CUSTOMER">
                            Customer
                        </option>

                        <option value="WORKER">
                            Worker
                        </option>

                    </select>

                </div>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    id="registerButton"
                    class="btn btn-primary btn-lg w-100"
                >

                    Create account

                    <i class="bi bi-arrow-right ms-2"></i>

                </button>


            </form>


            <!-- LOGIN LINK -->

            <p class="text-center text-secondary mt-4 mb-0">

                Already registered?

                <a href="login.html">
                    Sign in
                </a>

            </p>


        </div>

    </div>


    <!-- =====================================================
         PROJECT JAVASCRIPT
         ===================================================== -->

    <script src="js/app.js"></script>


    <script>

        /*
         * =====================================================
         * GET ELEMENTS
         * =====================================================
         */

        const registerForm =
            document.getElementById("registerForm");

        const message =
            document.getElementById("message");

        const nameInput =
            document.getElementById("name");

        const emailInput =
            document.getElementById("email");

        const phoneInput =
            document.getElementById("phone");

        const passwordInput =
            document.getElementById("password");

        const roleInput =
            document.getElementById("role");

        const registerButton =
            document.getElementById("registerButton");

        const togglePasswordButton =
            document.getElementById("togglePassword");


        /*
         * =====================================================
         * SHOW / HIDE PASSWORD
         * =====================================================
         */

        togglePasswordButton.addEventListener(
            "click",
            function () {

                if (passwordInput.type === "password") {

                    passwordInput.type = "text";

                    togglePasswordButton.innerHTML =
                        '<i class="bi bi-eye-slash"></i>';

                    togglePasswordButton.title =
                        "Hide password";

                }

                else {

                    passwordInput.type = "password";

                    togglePasswordButton.innerHTML =
                        '<i class="bi bi-eye"></i>';

                    togglePasswordButton.title =
                        "Show password";

                }

            }
        );


        /*
         * =====================================================
         * PHONE VALIDATION
         * =====================================================
         */

        phoneInput.addEventListener(
            "input",
            function () {

                /*
                 * Allow only numbers, spaces,
                 * +, -, and parentheses.
                 */

                this.value = this.value.replace(
                    /[^0-9+\-\s()]/g,
                    ""
                );

            }
        );


        /*
         * =====================================================
         * REGISTER FORM SUBMISSION
         * =====================================================
         */

        registerForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                /*
                 * Clear previous message
                 */

                message.innerHTML = "";


                /*
                 * Explicitly read values.
                 *
                 * IMPORTANT:
                 * Do not use name.value directly.
                 */

                const userData = {

                    name:
                        nameInput.value.trim(),

                    email:
                        emailInput.value.trim(),

                    phone:
                        phoneInput.value.trim(),

                    password:
                        passwordInput.value,

                    role:
                        roleInput.value

                };


                /*
                 * =================================================
                 * FRONTEND VALIDATION
                 * =================================================
                 */

                if (!userData.name) {

                    showError(
                        "Please enter your full name."
                    );

                    nameInput.focus();

                    return;

                }


                if (userData.name.length < 2) {

                    showError(
                        "Name must contain at least 2 characters."
                    );

                    nameInput.focus();

                    return;

                }


                if (!userData.email) {

                    showError(
                        "Please enter your email address."
                    );

                    emailInput.focus();

                    return;

                }


                /*
                 * Simple email validation
                 */

                const emailPattern =
                    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

                if (!emailPattern.test(userData.email)) {

                    showError(
                        "Please enter a valid email address."
                    );

                    emailInput.focus();

                    return;

                }


                if (!userData.phone) {

                    showError(
                        "Please enter your phone number."
                    );

                    phoneInput.focus();

                    return;

                }


                /*
                 * Count actual digits
                 */

                const phoneDigits =
                    userData.phone.replace(
                        /\D/g,
                        ""
                    );


                if (phoneDigits.length < 10) {

                    showError(
                        "Phone number must contain at least 10 digits."
                    );

                    phoneInput.focus();

                    return;

                }


                if (!userData.password) {

                    showError(
                        "Please enter a password."
                    );

                    passwordInput.focus();

                    return;

                }


                if (userData.password.length < 6) {

                    showError(
                        "Password must contain at least 6 characters."
                    );

                    passwordInput.focus();

                    return;

                }


                /*
                 * =================================================
                 * LOADING STATE
                 * =================================================
                 */

                const originalButton =
                    registerButton.innerHTML;

                registerButton.disabled = true;

                registerButton.innerHTML = `
                    <span
                        class="spinner-border spinner-border-sm me-2"
                        role="status"
                    ></span>
                    Creating account...
                `;


                try {


                    /*
                     * =================================================
                     * SEND REQUEST TO FASTAPI
                     * =================================================
                     */

                    const response =
                        await api(
                            "/auth/register",
                            {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(
                                        userData
                                    )

                            }
                        );


                    /*
                     * Parse response
                     */

                    const data =
                        await response.json();


                    /*
                     * =================================================
                     * HANDLE ERROR
                     * =================================================
                     */

                    if (!response.ok) {

                        let errorMessage =
                            "Registration failed.";


                        /*
                         * Normal FastAPI error
                         */

                        if (
                            typeof data.detail ===
                            "string"
                        ) {

                            errorMessage =
                                data.detail;

                        }


                        /*
                         * Pydantic validation errors
                         */

                        else if (
                            Array.isArray(
                                data.detail
                            )
                        ) {

                            errorMessage =
                                data.detail
                                    .map(
                                        function (
                                            error
                                        ) {

                                            const location =
                                                error.loc
                                                    ? error.loc.join(
                                                        " → "
                                                    )
                                                    : "Field";

                                            return `
                                                <div class="mb-1">
                                                    <strong>
                                                        ${location}
                                                    </strong>:
                                                    ${error.msg}
                                                </div>
                                            `;

                                        }
                                    )
                                    .join("");

                        }


                        /*
                         * Unknown error format
                         */

                        else if (
                            data.detail
                        ) {

                            errorMessage =
                                JSON.stringify(
                                    data.detail
                                );

                        }


                        throw new Error(
                            errorMessage
                        );

                    }


                    /*
                     * =================================================
                     * SUCCESS
                     * =================================================
                     */

                    message.innerHTML = `

                        <div class="alert alert-success">

                            <i
                                class="bi bi-check-circle-fill me-2"
                            ></i>

                            <strong>
                                Account created successfully!
                            </strong>

                            <br>

                            <span>
                                Redirecting you to login...
                            </span>

                        </div>

                    `;


                    /*
                     * Disable button
                     */

                    registerButton.disabled =
                        true;


                    /*
                     * Redirect
                     */

                    setTimeout(
                        function () {

                            window.location.href =
                                "login.html";

                        },
                        1200
                    );


                }


                /*
                 * =================================================
                 * CATCH ERROR
                 * =================================================
                 */

                catch (error) {

                    console.error(
                        "Registration error:",
                        error
                    );


                    message.innerHTML = `

                        <div class="alert alert-danger">

                            <i
                                class="bi bi-exclamation-circle-fill me-2"
                            ></i>

                            ${error.message}

                        </div>

                    `;


                    /*
                     * Restore button
                     */

                    registerButton.disabled =
                        false;

                    registerButton.innerHTML =
                        originalButton;


                }

            }
        );


        /*
         * =====================================================
         * ERROR HELPER
         * =====================================================
         */

        function showError(text) {

            message.innerHTML = `

                <div class="alert alert-danger">

                    <i
                        class="bi bi-exclamation-circle-fill me-2"
                    ></i>

                    ${text}

                </div>

            `;

        }

    </script>

</body>

</html>
